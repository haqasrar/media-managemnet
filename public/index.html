<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appex Studios — Media Management & Client Delivery Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/studio.css?v=6" />
</head>
<body class="selection:bg-sky-500/20 selection:text-sky-200">
  <div id="app-root" class="min-h-screen flex flex-col">
    <!-- Initial subtle loading state -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="glass-panel px-6 py-4 rounded-xl flex items-center gap-3 text-sm text-slate-300">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
        <span>Initializing Appex Studios Workspace…</span>
      </div>
    </div>
  </div>

  <!-- Hidden global file & folder inputs for instant uploads -->
  <input
    id="global-file-input"
    type="file"
    multiple
    accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip"
    class="hidden"
  />
  <input
    id="global-folder-input"
    type="file"
    webkitdirectory
    directory
    multiple
    class="hidden"
  />

  <script type="module" src="/js/app.js?v=8"></script>
</body>
</html>
